name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26.x"
      - name: gofmt/vet/test
        working-directory: candy/plugin-gh
        run: |
          gofmt -l . | grep -v '^$' && exit 1 || true
          go vet ./...
          go test ./...